</script>

<script type="text/html" data-template-name="kafka-producer">

    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="kafka.producer.name"></span> </label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]kafka.broker.name">
    </div>
    
    <div class="form-row">
    	<label for="node-input-broker"><i class="fa fa-list-ul"></i> <span data-i18n="kafka.broker.broker"></span></label>
    	<input type="text" id="node-input-broker">
  	</div>

    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-tag"></i> <span data-i18n="kafka.producer.topic"></span></label>
        <input type="text" id="node-input-topic" data-i18n="[placeholder]kafka.producer.topic">
    </div>

    <div class="form-row">
        <label for="node-input-requireAcks"><i class="fa fa-tag"></i> <span data-i18n="kafka.producer.requireAcks"></span></label>
        <input type="number" min="0" max="1"  id="node-input-requireAcks" >
    </div>

    <div class="form-row">
        <label for="node-input-ackTimeoutMs"><i class="fa fa-tag"></i> <span data-i18n="kafka.producer.ackTimeoutMs"></span></label>
        <input type="number" min="100" max="100000" step="100" id="node-input-ackTimeoutMs" >
    </div>

    <div class="form-row">
        <label for="node-input-attributes"><i class="fa fa-tag"></i> <span data-i18n="kafka.producer.attributes"></span></label>
         <select id="node-input-attributes">
         	<option value="0" data-i18n="kafka.producer.compression.none"></option>
         	<option value="1" data-i18n="kafka.producer.compression.gzip"></option>
         	<option value="2" data-i18n="kafka.producer.compression.snappy"></option>
         </select>
    </div>
    <div class="form-row">
		<input type="checkbox" id="node-input-useiot" style="display: inline-block; width: auto; vertical-align: top;">
		<label for="node-input-useiot" style="width: auto">上云配置</label>
	</div>
	<!-- iot 上云配置 -->
	<div id="node-config-iot" class="form-row">
		<hr/>
		<!-- 物模型 -->
		<div class="form-row">
			<label for="node-input-model"><i class="fa fa-tree"></i> <span>模型</span></label>
			<select type="text" id="node-input-model" style="width:70%;">
				<option value="use">- 用 msg.model 设定 -</option>
			</select>
			<!-- <input  id="node-input-model" type="text" placeholder="输入模型id" > -->
		</div>
		<!-- 设备实例 -->
		<div class="form-row">
			<label for="node-input-device"><i class="fa fa-laptop"></i> <span>设备</span></label>
			<select type="text" id="node-input-device" style="width:70%;">
				<option value="use">- 用 msg.device 设定 -</option>
			</select>
		</div>
		<div class="form-row">
			<label for="node-input-iotType"><i class="fa fa-tasks"></i> <span>类型</span></label>
			<!-- 上报类型：属性：props、事件：evnet、服务：service -->
			<select type="text" id="node-input-iotType" style="width:70%;">
				<option value="props">属性</option>
				<option value="event">事件</option>
				<option value="service">服务</option>
				<option value="use">- 用 msg.iotType 设定 -</option>
			</select>
		</div>
		<div class="form-row" style="margin-bottom:0;">
			<label><i class="fa fa-list"></i> <span>字段结构</span></label>
		</div>
		<div class="form-row node-input-iot-container-row">
			<ol id="node-input-iot-container"></ol>
		</div>
	</div>
</script>

<script type="text/javascript">
    RED.nodes.registerType('kafka-producer', {
        category: 'network',
        paletteLabel: RED._("node-red:kafka.producer.producer"),
        color: '#FFFFFF',
        defaults: {
            name: { required: false },
            broker: { type: "kafka-broker" },
            topic: { required: true },
            requireAcks: { value: 1, required: true },
            ackTimeoutMs: { value: 100, required: true },
            attributes: { value: 0, required: true },
            // edgeflow to iot config
            useiot: { value: false },
            model: { required: false, value: "" },
            device: { required: false, value: "" },
            iotType: { required: false, value: "props" },
            fields: { required: false, value: [] },
        },
        inputs: 1,
        inputLabels: "",
        outputs: 0,
        outputLabels: [],
        icon: "kafka.svg",
        allign: "right",
        label: function () {
            return this.name || this._("kafka.producer.producer");
        },
        labelStyle: function () {
            return "node_label_italic";
        },
        oneditprepare: function () {
            const node = this;
            function checkIot() {
                if (!$("#node-input-useiot").is(':checked')) {
                    $("#node-config-iot").hide();
                }
                else {
                    $("#node-config-iot").show();
                }
            }
            // edgeflow to iot config

            checkIot();

            $("#node-input-useiot").click(function () {
                checkIot();
            });

            const headerList = $("#node-input-iot-container").css('min-height', '360px').css('min-width', '430px').editableList({
                addItem: function (container, i, item) {
                    const row = $('<div/>').css({
                        overflow: 'hidden',
                        whiteSpace: 'nowrap',
                        display: 'flex'
                    }).appendTo(container);
                    const propertNameCell = $('<div/>').css({ 'flex-grow': 1 }).appendTo(row);
                    const propertyName = $('<input/>', { class: "node-input-key-name", type: "text", style: "width: 100%" })
                        .appendTo(propertNameCell)
                        .typedInput({ types: ['str'] });

                    const propertyValueCell = $('<div/>').css({ 'flex-grow': 1, 'margin-left': '10px' }).appendTo(row);
                    const propertyValue = $(`<select class= "node-input-key-value">${optionHtml}</select>`, { style: "width: 100%" })
                        .appendTo(propertyValueCell)

                    const setup = function (_header) {
                        const { fieldName, dataType = 'TEXT' } = item;
                        propertyName.typedInput('value', fieldName);
                        propertyValue.val(dataType);
                    }
                    setup(item);

                },
                sortable: true,
                removable: true
            });
            if (node.fields) {
                for (let index = 0; index < node.fields.length; index++) {
                    const element = node.fields[index];
                    headerList.editableList('addItem', node.fields[index]);
                }
            }
        },
        oneditsave: function () {
            const fields = $("#node-input-iot-container").editableList('items');
            const node = this;
            node.fields = [];
            fields.each(function (i) {
                const item = $(this);
                const fieldName = item.find(".node-input-key-name").val();
                const dataType = item.find(".node-input-key-value").find(":selected").val();
                console.log(fieldName, dataType)
                node.fields.push({
                    fieldName, dataType
                })
            });
        },
        oneditresize: function (size) {
            const dlg = $("#dialog-form");
            const expandRow = dlg.find('.node-input-iot-container-row');
            let height = dlg.height() - 300;
            if (expandRow && expandRow.length) {
                const siblingRows = dlg.find('> .form-row:not(.node-input-iot-container-row)');
                for (let i = 0; i < siblingRows.size(); i++) {
                    const cr = $(siblingRows[i]);
                    if (cr.is(":visible"))
                        height -= cr.outerHeight(true);
                }
                $("#node-input-iot-container").editableList('height', height);
            }
        }
    });
</script>
