<script type="text/javascript">
    RED.nodes.registerType('rabbitmq-in', {
      category: 'network',
      color: '#98b886',
      paletteLabel: RED._("node-red:rabbitmq.in.in"),
      defaults: {
        name: { value: '' },
        broker: { value: '', type: 'rabbitmq-broker' },
        prefetch: { value: 0 },
        reconnectOnError: { value: false },
        noAck: { value: true },
        exchangeName: { value: '' },
        exchangeType: { value: 'topic' },
        exchangeRoutingKey: { value: '' },
        exchangeDurable: { value: true },
        queueName: { value: '' },
        queueType: { value: 'quorum'},
        queueExclusive: { value: true },
        queueDurable: { value: false },
        queueAutoDelete: { value: true },
        headers: { value: '{}' },
      },
      inputs: 1,
      outputs: 1,
      icon: 'rabbitmq.svg',
      label: function () {
        if (this.name) {
          return this.name
        }
        const name = this.exchangeName
        const colon = name && this.exchangeRoutingKey ? ': ' : ''
        const label = name + colon + this.exchangeRoutingKey
        return label || this._("rabbitmq.in.in")
      },
      oneditprepare: function () {
        $('#node-input-headers').typedInput({
          type: 'json',
          types: ['json'],
        })
  
        $('#node-input-exchangeType').change(function (e) {
          const exchangeType = this.value
  
          if (['fanout', 'headers'].includes(exchangeType)) {
            $('.routing-key-form-input').hide()
          } else {
            $('.routing-key-form-input').show()
          }
  
          if (['headers'].includes(exchangeType)) {
            $('.headers-form-input').show()
          } else {
            $('.headers-form-input').hide()
          }
        })
  
        $("#node-input-queueType").typedInput({
          types: [
            {
              value: "quorum",
              options: [
                { value: "quorum", label: "Quorum"},
                { value: "classic", label: "Classic"}
              ]
            }
          ]
        })
      },
    })
  </script>
  
  <style>
    div.wide-label-rabbitmq-in label {
      width: 30% !important;
    }
    div.wide-label-rabbitmq-in input {
      width: 65% !important;
    } 
  </style>
  
  <script type="text/html" data-template-name="rabbitmq-in">

      <input type="text" id="node-input-name" placeholder="Leave blank to use exchange name" data-i18n="[placeholder]rabbitmq.in.name">
    </div>
    <div class="form-row">
      <label for="node-input-broker"><i class="fa fa-globe"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.in.broker"></span></label>
      <input type="text" id="node-input-broker" placeholder="RABBITMQ Broker" data-i18n="[placeholder]rabbitmq.in.brokerPlaceholder">
    </div>
    <div class="form-row">
      <label for="node-input-prefetch"><i class="fa fa-filter"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.in.prefetch"></span></label>
      <input type="text" id="node-input-prefetch" placeholder="0 for no prefetch restriction" data-i18n="[placeholder]rabbitmq.in.prefetchPlaceholder">

    <div class="form-row">

      <input id="node-input-reconnectOnError" style="width:20px; vertical-align:baseline; margin-right:5px;" type="checkbox">
      <label for="node-input-reconnectOnError" style="width:auto; margin-top:7px;" data-i18n="rabbitmq.in.reconnectOnError"></label>
    </div>
    <div class="form-row">
      <label>&nbsp;</label>
      <input style="width:20px; vertical-align:baseline; margin-right:5px;" type="checkbox" id="node-input-noAck">
      <label style="width:auto; margin-top:7px;" for="node-input-noAck" data-i18n="rabbitmq.in.noAck"></label>
    </div>
    <div class="form-tips">
      <i class="fa fa-info-circle"></i>
      <span data-i18n="rabbitmq.in.noAckTip"></span>

    <hr>
    <h4><span data-i18n="rabbitmq.in.exchangeInfo"></span></h4>
    <div class="form-row wide-label-rabbitmq-in">
      <label for="node-input-exchangeType"><i class="fa fa-filter"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.in.exchangeType"></span></label>

    </div>
    <div class="form-row wide-label-rabbitmq-in routing-key-form-input">
      <label for="node-input-exchangeRoutingKey"><i class="fa fa-filter"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.in.exchangeRoutingKey"></span></label>
      <input type="text" id="node-input-exchangeRoutingKey">

      <input style="width:20px; vertical-align:baseline; margin-right:5px;" type="checkbox" id="node-input-exchangeDurable">

    <hr>
    <h4><span data-i18n="rabbitmq.in.queueInfo"></span></h4>
      <div class="form-row wide-label-rabbitmq-in">
        <label for="node-input-queueName"><i class="fa fa-tag"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.in.queueName"></span></label>
        <input type="text" id="node-input-queueName" placeholder="Leave blank to auto-generate" data-i18n="[placeholder]rabbitmq.in.queueNamePlaceholder">
      </div>
      <div class="form-row wide-label-rabbitmq-in-manual-ack">
        <label for="node-input-queueName"><i class="fa fa-tag"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.in.queueType"></span></label>
        <input type="text" id="node-input-queueType">
      </div>
  
      <div class="form-row">
        <label>&nbsp;</label>
        <input style="width:20px; vertical-align:baseline; margin-right:5px;" type="checkbox" id="node-input-queueExclusive">
        <label style="width:auto; margin-top:7px;" for="node-input-queueExclusive" data-i18n="rabbitmq.in.queueExclusive"></label>
      </div>
      <div class="form-row">
        <label>&nbsp;</label>
        <input style="width:20px; vertical-align:baseline; margin-right:5px;" type="checkbox" id="node-input-queueDurable">
        <label style="width:auto; margin-top:7px;" for="node-input-queueDurable" data-i18n="rabbitmq.in.queueDurable"></label>
      </div>
      <div class="form-row">
        <label>&nbsp;</label>
        <input style="width:20px; vertical-align:baseline; margin-right:5px;" type="checkbox" id="node-input-queueAutoDelete">
        <label style="width:auto; margin-top:7px;" for="node-input-queueAutoDelete" data-i18n="rabbitmq.in.queueAutoDelete"></label>
      </div>
  </script>
  
  <script type="text/html" data-help-name="rabbitmq-in">
    <p>Connects to an rabbitmq broker and receives messages.</p>
  
    <h3>Outputs</h3>
    <dl class="message-properties">
      <dt>fields
        <span class="property-type">object</span>
      </dt>
      <dd>
        An <a href="" target="_blank">rabbitmqlib</a>
        fields object. Contains:
        <ul>
          <li><code>consumerTag</code>: string</code></li>
          <li><code>deliveryTag</code>: number</code></li>
          <li><code>redelivered</code>: boolean</code></li>
          <li><code>exchange</code>: string</code></li>
          <li><code>routingKey</code>: string</code></li>
        </ul>
      </dd>
      <dt>properties
        <span class="property-type">object</span>
      </dt>
      <dd>
        Standard rabbitmq message properties as specified in <a href="" target="_blank">the amqplib docs</a>.
        <br />
        <ul>
          <li><code>contentType</code>: any | undefined</li>
          <li><code>contentEncoding</code>: any | undefined</li>
          <li><code>headers</code>: Object | undefined</li>
          <li><code>deliveryMode</code>: any | undefined</li>
          <li><code>priority</code>: any | undefined</li>
          <li><code>correlationId</code>: any | undefined</li>
          <li><code>replyTo</code>: any | undefined</li>
          <li><code>expiration</code>: any | undefined</li>
          <li><code>messageId</code>: any | undefined</li>
          <li><code>timestamp</code>: any | undefined</li>
          <li><code>type</code>: any | undefined</li>
          <li><code>userId</code>: any | undefined</li>
          <li><code>appId</code>: any | undefined</li>
          <li><code>clusterId</code>: any | undefined</li>
        </ul>
      </dd>
      <dt>content
        <span class="property-type">buffer</span>
      </dt>
      <dt>payload
        <span class="property-type">json | object | primitive</span>
      </dt>
      <dd>the payload of the message received. </dd>
    </dl>
  
    <h3>Inputs</h3>
    <p>
      <code>msg.payload</code> control rabbitmq-broker reconnect by send {"reconnectCall": true}, 
    </p>
  
    <h3>Details</h3>
    <p>
      <code>fields</code>, <code>properties</code>, and <code>content</code> all come from the <a href="" target="_blank">amqplib</a> object attached to the incoming message.
    </p>
    <p>
      <code>msg.payload</code> is used as the payload of the received message.
      If it contains a string that can be parsed in to json it will be run through JSON.parse(). Otherwise it will be sent as is.
    </p>
  </script>
