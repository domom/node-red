<script type="text/html" data-help-name="kafka-consumer">
    <p>A Kafka Consumer Group</p>
</script>

<script type="text/html" data-template-name="kafka-consumer">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> <span data-i18n="kafka.consumer.name"></span></label>
        <input type="text" id="node-input-name" data-i18n="[placeholder]kafka.consumer.name">
    </div>
    
    <div class="form-row">
    	<label for="node-input-broker"><i class="fa fa-list-ul"></i> <span data-i18n="kafka.consumer.broker"></span></label>
    	<input type="text" id="node-input-broker"  data-i18n="[placeholder]kafka.consumer.broker">
    </div>
      
    <div class="form-row">
        <label for="node-input-groupid"><i class="fa fa-tag"></i> <span data-i18n="kafka.consumer.groupid"></span></label>
        <input type="text" id="node-input-groupid" data-i18n="[placeholder]kafka.consumer.groupid">
    </div>
    <div class="form-row">
        <label for="node-input-topic"><i class="fa fa-tag"></i> <span data-i18n="kafka.consumer.topic"></span></label>
        <input type="text" id="node-input-topic" data-i18n="[placeholder]kafka.consumer.topic">
    </div>

    <div class="form-row">
        <label for="node-input-minbytes"><i class="fa fa-tag"></i> <span data-i18n="kafka.consumer.minbytes"></span></label>
        <input type="number" id="node-input-minbytes" data-i18n="[placeholder]kafka.consumer.minbytes">
    </div>

    <div class="form-row">
        <label for="node-input-maxbytes"><i class="fa fa-tag"></i> <span data-i18n="kafka.consumer.maxbytes"></span></label>
        <input type="number" id="node-input-maxbytes" data-i18n="[placeholder]kafka.consumer.maxbytes">
    </div>

    <div class="form-row">
        <label for="node-input-fromOffset"><i class="fa fa-tag"></i> <span data-i18n="kafka.consumer.fromOffset"></span></label>
         <select id="node-input-fromOffset">
         	<option value="latest" data-i18n="kafka.consumer.offset.latest"></option>
         	<option value="earliest" data-i18n="kafka.consumer.offset.earliest"></option>
         	<option value="none" data-i18n="kafka.consumer.offset.none"></option>
         </select>
    </div>

    <div class="form-row">
        <label for="node-input-outOfRangeOffset"><i class="fa fa-tag"></i> <span data-i18n="kafka.consumer.outOfRangeOffset"></span></label>
         <select id="node-input-outOfRangeOffset">
         	<option value="latest" data-i18n="kafka.consumer.offset.earliest"></option>
         	<option value="earliest" data-i18n="kafka.consumer.offset.latest"></option>
         	<option value="none" data-i18n="kafka.consumer.offset.none"></option>
         </select>
    </div>

    <div class="form-row">
        <label for="node-input-encoding"><i class="fa fa-tag"></i> <span data-i18n="kafka.consumer.encodingLabel"></span></label>
         <select id="node-input-encoding">
         	<option value="utf8" data-i18n="kafka.consumer.encoding.utf8"></option>
         	<option value="buffer" data-i18n="kafka.consumer.encoding.buffer"></option>
         </select>
    </div>

</script>

<script type="text/javascript">
    RED.nodes.registerType('kafka-consumer',{
        category: 'network',
        paletteLabel: RED._("node-red:kafka.consumer.consumer"),
        color: '#FFFFFF',
        defaults: {
            name: {required:false},
            broker: {type:"kafka-broker"},
            outOfRangeOffset: {value:"earliest"},
            fromOffset: {value:"latest"},
            topic: {required:true},
            groupid: {required:false},
            encoding: {value: "utf8"}
        },
        inputs:0,
        outputs:1,
        align: "left",
        icon: "kafka.svg",
        label: function() {
            return this.name || this._("kafka.consumer.consumer");
        },
        labelStyle: function() {
            return "node_label_italic";
        },
        oneditprepare: function() {

        },
        oneditsave: function() {

        },
        oneditresize: function(size) {

        }
    });
</script>
