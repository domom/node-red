<script type="text/html" data-help-name="kafka-broker">
    <p>Define a kafka-broker. </p>
    <p>"Hosts process.env name" can contain a process.env property name that contained hosts as JSON string,e.g.</p>
    <textarea>process.env.atesthosts='[{"host":"atesthost1","port":1234},{"host":"atesthost2","port":4321}]';</textarea>
    <p>Note, minimal data quality checks performed.</p>
</script>

<script type="text/html" data-template-name="kafka-broker">

    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i>  <span data-i18n="kafka.broker.name"></span></label>
        <input id="node-config-input-name" type="text" data-i18n="[placeholder]kafka.broker.name">
	</div>
	
	<div class="form-row">
        <label for="node-config-input-hosts"><i class="fa fa-tag"></i> <span data-i18n="kafka.broker.hosts"></span></label>
        <input  id="node-config-input-hosts" type="text" data-i18n="[placeholder]kafka.broker.hosts.placeholder">
    </div>

    <div class="form-row">
        <input type="checkbox" id="node-config-input-usesasl" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-config-input-usesasl" style="width: auto" data-i18n="kafka.broker.usesasl"></label>
    </div>

    <div id="node-config-sasl" class="form-row">
        <div class="form-row">
            <label for="node-config-input-username"><i class="fa fa-tag"></i> <span data-i18n="kafka.broker.username"></span></label>
            <input  id="node-config-input-username" type="text" data-i18n="[placeholder]kafka.broker.username.placeholder">
        </div>
        <div class="form-row">
            <label for="node-config-input-password"><i class="fa fa-tag"></i> <span data-i18n="kafka.broker.password"></span></label>
            <input  id="node-config-input-password" type="text" data-i18n="[placeholder]kafka.broker.password.placeholder">
        </div>
    </div>

    <div class="form-row">
        <input type="checkbox" id="node-config-input-usetls" style="display: inline-block; width: auto; vertical-align: top;">
        <label for="node-config-input-usetls" style="width: auto" data-i18n="kafka.broker.usetls"></label>
    </div>
    
    <div id="node-config-tls" class="form-row">
        <div class="form-row">
            <label for="node-config-input-cacert"><i class="fa fa-tag"></i> <span data-i18n="kafka.broker.cacert"></span></label>
            <input  id="node-config-input-cacert" type="text" data-i18n="[placeholder]kafka.broker.cacert.placeholder">
        </div>
        
        <div class="form-row">
            <label for="node-config-input-clientcert"><i class="fa fa-tag"></i> <span data-i18n="kafka.broker.clientcert"></span></label>
            <input  id="node-config-input-clientcert" type="text" data-i18n="[placeholder]kafka.broker.clientcert.placeholder">
        </div>
        
        <div class="form-row">
            <label for="node-config-input-privatekey"><i class="fa fa-tag"></i> <span data-i18n="kafka.broker.privatekey"></span></label>
            <input  id="node-config-input-privatekey" type="text" data-i18n="[placeholder]kafka.broker.privatekey.placeholder">
        </div>
        
        <div class="form-row">
            <label for="node-config-input-passphrase"><i class="fa fa-tag"></i> <span data-i18n="kafka.broker.passphrase"></span></label>
            <input  id="node-config-input-passphrase" type="password" data-i18n="[placeholder]kafka.broker.passphrase.placeholder">
        </div>

        <div class="form-row">
            <input type="checkbox" id="node-config-input-selfsign" style="display: inline-block; width: auto; vertical-align: top;">
            <label for="node-config-input-selfsign" style="width: auto" data-i18n="kafka.broker.selfsign"></label>
        </div>
    </div>

</script>

<script type="text/javascript">

	// 数据类型
	const dataTypes = [
        { value: "TEXT", label: "TEXT", hasValue: false },
        { value: "INT32", label: "INT32", hasValue: false },
        { value: "FLOAT", label: "FLOAT", hasValue: false },
        { value: "BOOLEAN", label: "BOOLEAN", hasValue: false },
    ];

	const optionHtml = dataTypes.map(({value,label})=>`<option value="${value}">${label}</option>\n`);

    RED.nodes.registerType('kafka-broker',{
        category: 'network',
        icon: "kafka.svg",
        color: "#aec6e7",
        defaults: {
        	name: {required:false},
        	hosts: {required: true},

			usesasl: {value: false},
			username: {required:false},
			password: {required:false},

			usetls: {value: false},
			cacert: {required:false},
			clientcert: {required:false},
			privatekey: {required:false},
			passphrase: {required:false},
			selfsign: {value: false,required: false},
		},

        label: function() {
            return this.name || this._("kafka.broker.broker");
		},
		
        labelStyle: function() {
            return "node_label_italic";
		},
		
  	    oneditprepare: function() {
			const node = this;
			function checkTls(){
				if (!$("#node-config-input-usetls").is(':checked')) {
					$("#node-config-tls").hide();
				}
				else{
					$("#node-config-tls").show();
				}
			}

			function checkSasl(){
				if (!$("#node-config-input-usesasl").is(':checked')) {
					$("#node-config-sasl").hide();
				}
				else{
					$("#node-config-sasl").show();
				}
			}

			checkTls();
			checkSasl();

			$("#node-config-input-usetls").click(function(){
				checkTls();
			});

			$("#node-config-input-usesasl").click(function(){
				checkSasl();
			});

  		},
		oneditsave: function() {
		
		},
		oneditresize: function(size) {
			
		},
        paletteLabel: RED._("node-red:kafka.broker.broker"),
    });
</script>
