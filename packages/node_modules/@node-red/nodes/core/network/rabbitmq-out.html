<script type="text/javascript">
    RED.nodes.registerType('rabbitmq-out', {
      category: 'network',
      color: '#98b886',
      paletteLabel: RED._("node-red:rabbitmq.out.out"),
      defaults: {
        name: { value: '' },
        broker: { value: '', type: 'rabbitmq-broker' },
        reconnectOnError: { value: false },
        exchangeName: { value: '' },
        exchangeType: { value: 'topic' },
        exchangeRoutingKey: { value: '' },
        exchangeRoutingKeyType: { value: 'str' },
        exchangeDurable: { value: true },
        rabbitmqProperties: {
          value: '{ "headers": {} }',
        },
        rpcTimeoutMilliseconds: { value: 3000 },
        outputs: { value: 0 },
      },
      inputs: 1,
      outputs: 0,
      align: 'right',
      icon: 'rabbitmq.svg',
      label: function () {
        if (this.name) {
          return this.name
        }
        const name = this.exchangeName
        const colon = name && this.exchangeRoutingKey ? ': ' : ''
        const label = name + colon + this.exchangeRoutingKey
        return label || this._("rabbitmq.out.out")
      },
      oneditprepare: function () {
        $("#node-input-exchangeRoutingKey").typedInput({
          default: "str",
          types: ["str", "msg", "flow", "global", "jsonata"],
          typeField: $("#node-input-exchangeRoutingKeyType")
        })
  
        $('#node-input-rabbitmqProperties').typedInput({
          type: 'json',
          types: ['json'],
        })
  
        $('#node-input-rpcTimeoutMilliseconds').typedInput({
          type: 'num',
          types: ['num'],
        })
  
        $('#node-input-exchangeType').change(function (e) {
          const exchangeType = this.value
  
          // hide/show routing key field
          if (['fanout', 'headers'].includes(exchangeType)) {
            $('.routing-key-form-input').hide()
          } else {
            $('.routing-key-form-input').show()
          }
  
          // hide/show headers exchange help text
          if (['headers'].includes(exchangeType)) {
            $('.headers-form-input').show()
          } else {
            $('.headers-form-input').hide()
          }
        })
      },
    })
  
    function truncate(str, length = 40, ending = '...') {
      if (str.length > length) {
        return str.substring(0, length - ending.length) + ending
      }
      return str
    }
  </script>
  
  <style>
    div.wide-label-rabbitmq-out label {
      width: 35% !important;
    }
    div.wide-label-rabbitmq-out input.simple-input {
      width: 64% !important;
    }
    div.wide-label-rabbitmq-out div.red-ui-typedInput-container {
      width: 64% !important
    }
    div.wider-label-rabbitmq-out label {
      width: 50% !important;
    }
    select.small-rabbitmq-out {
      width: 75px !important;
    }
    input.small-rabbitmq-out {
      width: 120px !important;
    }
    div.form-tips {
      margin: 20px 0;
    }
  </style>
  
  <script type="text/html" data-template-name="rabbitmq-out">
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.out.name"></span></label>
      <input type="text" id="node-input-name" data-i18n="[placeholder]rabbitmq.out.name_placeholder"
    </div>
    <div class="form-row">
      <label for="node-input-broker"><i class="fa fa-globe"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.out.broker"></span></label>
      <input type="text" id="node-input-broker" data-i18n="[placeholder]rabbitmq.out.broker_placeholder"
    </div>
    <div class="form-row">
      <label>&nbsp;&nbsp;</label>
      <input id="node-input-reconnectOnError" style="width:20px; vertical-align:baseline; margin-right:5px;" type="checkbox">
      <label for="node-input-reconnectOnError" style="width:auto; margin-top:7px;" data-i18n="rabbitmq.out.reconnectOnError"></label>
    </div>
    <hr>
    <h4><span data-i18n="rabbitmq.out.exchangeInfo"></span></h4>
    <div class="form-row wide-label-rabbitmq-out">
      <label for="node-input-exchangeType"><i class="fa fa-filter"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.out.exchangeType"></span></label>
      <select id="node-input-exchangeType">
        <option value="topic">Topic</option>
        <option value="direct">Direct</option>
        <option value="fanout">Fanout</option>
        <option value="headers">Headers</option>
      </select>
    </div>
    <div class="form-tips headers-form-input">
      <i class="fa fa-info-circle"></i>
      
      <span data-i18n="rabbitmq.out.headersFormInput"></span>
    </div>
    <div class="form-row wide-label-rabbitmq-out">
      <label for="node-input-exchangeName"><i class="fa fa-tag"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.out.exchangeName"></span></label>
      <input type="text" class="simple-input" id="node-input-exchangeName" data-i18n="[placeholder]rabbitmq.out.exchangeName_placeholder"
    </div>
    <div class="form-row wide-label-rabbitmq-out routing-key-form-input">
      <label for="node-input-exchangeRoutingKey"><i class="fa fa-filter"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.out.exchangeRoutingKey"></span></label>
      <input type="text" id="node-input-exchangeRoutingKey">
      <input type="hidden" id="node-input-exchangeRoutingKeyType" />
    </div>
    <div class="form-tips routing-key-form-input">
      <i class="fa fa-info-circle"></i>
      <span data-i18n="rabbitmq.out.routingKeyTip">
        You can specify multiple routing keys separated by commas
      </span>
      
    </div>
    <div class="form-row">
      <label>&nbsp;</label>
      <input style="width:20px; vertical-align:baseline; margin-right:5px;" type="checkbox" id="node-input-exchangeDurable">
      <label style="width:auto; margin-top:7px;" for="node-input-exchangeDurable" data-i18n="rabbitmq.out.exchangeDurable"></label>
    </div>
    <hr>
    <h4><span data-i18n="rabbitmq.out.messageInfo"></span></h4>
    <div class="form-row wide-label-rabbitmq-out">
      <label for="node-input-rabbitmqProperties"><i class="fa fa-filter"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.out.rabbitmqProperties"></span></label>
      <input type="text" id="node-input-rabbitmqProperties">
    </div>
    <div class="form-tips">
      <i class="fa fa-info-circle"></i>
      <span data-i18n="rabbitmq.out.propertiesTip">
        Standard rabbitmq message properties as specified in <a href="" target="_blank">the rabbitmqlib docs</a>.
      </span>
      
    </div>
    <span id="rpc-section">
      <hr>
      <h4><span data-i18n="rabbitmq.out.rpcInfo"></span></h4>
      <div class="form-row wider-label-rabbitmq-out">
        <label for="node-input-outputs"><i class="fa fa-globe"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.out.requestRPCResponse"></span></label>
        <select id="node-input-outputs" class="small-rabbitmq-out">
          <option value="0">No</option>
          <option value="1">Yes</option>
        </select>
      </div>
      <div class="form-row wider-label-rabbitmq-out">
        <label for="node-input-rpcTimeoutMilliseconds"><i class="fa fa-clock-o"></i>&nbsp;&nbsp;<span data-i18n="rabbitmq.out.rpcTimeout"></span></label>
        <input type="text" class="small-rabbitmq-out" id="node-input-rpcTimeoutMilliseconds">
      </div>
      <div class="form-tips">
        <i class="fa fa-info-circle"></i>
        <span data-i18n="rabbitmq.out.rpcTip"></span>
        <br />
        <br />
        <span data-i18n="rabbitmq.out.rpcOverrideTip"></span>
      </div>
    </span>
  </script>
  
  <script type="text/html" data-help-name="rabbitmq-out">
    <p>Connects and sends messages to an rabbitmq broker.</p>
  
    <h3>Inputs</h3>
    <dl class="message-properties">
      <dt>payload
        <span class="property-type">json | object | primitive</span>
      </dt>
      <dd>the payload of the message to send to the rabbitmq broker. </dd>
      <dt>routingKey
        <span class="property-type">string</span>
      </dt>
      <dd>
        If the node's routing key field type is specified as a string, the value of this field will override the node's configured routing key(s). If the node's routing key field type is not specified as a string, this value will have no effect and the value of the typedinput will be used as the routing key.
      </dd>
      <dt>properties
        <span class="property-type">object</span>
      </dt>
      <dd>
        Standard rabbitmq message properties as specified in <a href="" target="_blank">the rabbitmqlib docs</a>. This will shallow merge with whatever is specified in the properties field in the node's configuration.
        <br />
        <ul>
          <li><code>contentType</code>: any | undefined</li>
          <li><code>contentEncoding</code>: any | undefined</li>
          <li><code>headers</code>: Object | undefined</li>
          <li><code>deliveryMode</code>: any | undefined</li>
          <li><code>priority</code>: any | undefined</li>
          <li><code>correlationId</code>: any | undefined</li>
          <li><code>replyTo</code>: any | undefined</li>
          <li><code>expiration</code>: any | undefined</li>
          <li><code>messageId</code>: any | undefined</li>
          <li><code>timestamp</code>: any | undefined</li>
          <li><code>type</code>: any | undefined</li>
          <li><code>userId</code>: any | undefined</li>
          <li><code>appId</code>: any | undefined</li>
          <li><code>clusterId</code>: any | undefined</li>
        </ul>
      </dd>
    </dl>
  
    <h3>Payload stringification</h3>
    <p>By default the payload is run through `JSON.stringify()` before being published. To override this behavior include
      <code>
        doNotStringifyPayload: true
      </code>
      in the message's properties.headers object
    </p>
  </script>
