<script type="text/html" data-help-name="rabbitmq-broker">
    <h3>从设置获取凭据</h3>
    <p>
      如果选中此项，将使用settings.js文件中指定的变量作为连接代理的用户名和密码
    </p>
    <p>
      用于用户名和密码的字段名分别为：
      <br />
      <strong>MW_CONTRIB_RABBITMQ_USERNAME</strong> 和
      <br />
      <strong>MW_CONTRIB_RABBITMQ_PASSWORD</strong>
    </p>
    <p>
      它们可以与其他字段一起添加到settings.js文件中：
    </p>
      <pre>
  module.exports = {
    ...
    MW_CONTRIB_RABBITMQ_USERNAME: 'rabbitmq',
    MW_CONTRIB_RABBITMQ_PASSWORD: 'rabbitmq',
    ...
  }
      </pre>
  
    <p>
      推荐的设置方式是：
      <ol>
        <li>使用<em>dotenv</em> npm包通过环境变量指定您的凭据。</li>
        <li>在设置文件中像上面的示例一样导出这些变量。</li>
        <li>在环境中将它们设置为空字符串，如：`process.env.MW_CONTRIB_RABBITMQ_PASSWORD = ''`。</li>
      </ol>
      最后一步非常重要，因为环境变量可以通过前端访问，任何用户都能访问到。
    </p>
  </script>
