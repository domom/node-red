<script type="text/html" data-help-name="rabbitmq-in-manual-ack">
    <p>连接到RabbitMQ代理，接收消息，并<strong>手动确认接收</strong>。</p>
    <p>此节点默认将<em>noAck</em>设置为false。<em style="color: firebrick;">您必须通过将消息发送回节点的输入来手动确认（ack）或否认（nack）接收</em>。任何未确认的消息在客户端断开连接或重启时都将重新排队。如果您不需要这样手动确认消息，请使用<strong>rabbitmq-in</strong>节点。请查看导入库中的示例流程以更好地了解如何使用此节点。</p>
  
    <h3>输入</h3>
    <dl class="message-properties">
      <dt>msg
        <span class="property-type">对象</span>
      </dt>
      <dd>通过此节点输出的整个消息应该被发送回输入以成功确认或否认</dd>
    </dl>
    <dl class="message-properties">
      <dt>msg.manualAck
        <span class="property-type">对象</span>
      </dt>
      <dd>一个可选的配置对象，用于指定确认模式和行为。如果未指定，消息本身仍会被确认。</dd>
    </dl>
    <dl class="message-properties">
      <dt>msg.manualAck.ackMode
        <span class="property-type">字符串</span>
      </dt>
      <dd>确认类型。有效值包括
        <code>ack</code>（确认）,
        <code>ackAll</code>（确认所有）,
        <code>nack</code>（否认）,
        <code>nackAll</code>（否认所有）,
        和 <code>reject</code>（拒绝）。
        默认为 <code>ack</code></dd>
    </dl>
    <dl class="message-properties">
      <dt>msg.manualAck.allUpTo
        <span class="property-type">布尔值</span>
      </dt>
      <dd><code>allUpTo</code>用于（否）确认的选项。如果为true，将（否）确认队列中当前消息之前的所有消息。默认为false。</dd>
    </dl>
    <dl class="message-properties">
      <dt>msg.manualAck.requeue
        <span class="property-type">布尔值</span>
      </dt>
      <dd><code>requeue</code>用于否认的选项。如果为true，将否认并重新排队该消息。如果为false，将否认并发送到死信队列。默认为false。</dd>
    </dl>
    <p>
      <code>msg.payload</code>通过发送{"reconnectCall": true}来控制RabbitMQ代理重新连接
    </p>
  
    <h3>输出</h3>
    <dl class="message-properties">
      <dt>fields
        <span class="property-type">对象</span>
      </dt>
      <dd>
        一个<a href="" target="_blank">rabbitmqlib</a>
        字段对象。包含：
        <ul>
          <li><code>consumerTag</code>：字符串</li>
          <li><code>deliveryTag</code>：数字</li>
          <li><code>redelivered</code>：布尔值</li>
          <li><code>exchange</code>：字符串</li>
          <li><code>routingKey</code>：字符串</li>
        </ul>
      </dd>
      <dt>properties
        <span class="property-type">对象</span>
      </dt>
      <dd>
        标准RabbitMQ消息属性，如<a href="" target="_blank">rabbitmqlib文档</a>中所述。
        <br />
        <ul>
          <li><code>contentType</code>：任意 | undefined</li>
          <li><code>contentEncoding</code>：任意 | undefined</li>
          <li><code>headers</code>：对象 | undefined</li>
          <li><code>deliveryMode</code>：任意 | undefined</li>
          <li><code>priority</code>：任意 | undefined</li>
          <li><code>correlationId</code>：任意 | undefined</li>
          <li><code>replyTo</code>：任意 | undefined</li>
          <li><code>expiration</code>：任意 | undefined</li>
          <li><code>messageId</code>：任意 | undefined</li>
          <li><code>timestamp</code>：任意 | undefined</li>
          <li><code>type</code>：任意 | undefined</li>
          <li><code>userId</code>：任意 | undefined</li>
          <li><code>appId</code>：任意 | undefined</li>
          <li><code>clusterId</code>：任意 | undefined</li>
        </ul>>
      </dd>
      <dt>content
        <span class="property-type">缓冲区</span>
      </dt>
      <dt>payload
        <span class="property-type">json | 对象 | 原始值</span>
      </dt>
      <dd>接收到的消息的载荷。</dd>
    </dl>
  
    <h3>详细信息</h3>
    <p>
      <code>fields</code>、<code>properties</code>和<code>content</code>都来自附加到传入消息的<a href="" target="_blank">rabbitmqlib</a>对象。
    </p>
    <p>
      <code>msg.payload</code>用作接收到的消息的载荷。
      如果它包含可以解析为json的字符串，将通过JSON.parse()处理。否则将按原样发送。
    </p>
  </script>
