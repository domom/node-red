<script type="text/html" data-help-name="rabbitmq-out">
    <p>连接并发送消息到RabbitMQ代理服务器。</p>
  
    <h3>输入</h3>
    <dl class="message-properties">
      <dt>payload
        <span class="property-type">json | object | primitive</span>
      </dt>
      <dd>要发送到RabbitMQ代理服务器的消息内容。</dd>
      <dt>routingKey
        <span class="property-type">string</span>
      </dt>
      <dd>
        如果节点的路由键字段类型被指定为字符串，此字段的值将覆盖节点配置的路由键。如果节点的路由键字段类型未被指定为字符串，此值将不会生效，而是使用类型输入框中的值作为路由键。
      </dd>
      <dt>properties
        <span class="property-type">object</span>
      </dt>
      <dd>
        RabbitMQ标准消息属性，详见<a href="" target="_blank">RabbitMQ库文档</a>。这些属性将与节点配置中的properties字段进行浅合并。
        <br />
        <ul>
          <li><code>contentType</code>：任意值 | undefined</li>
          <li><code>contentEncoding</code>：任意值 | undefined</li>
          <li><code>headers</code>：对象 | undefined</li>
          <li><code>deliveryMode</code>：任意值 | undefined</li>
          <li><code>priority</code>：任意值 | undefined</li>
          <li><code>correlationId</code>：任意值 | undefined</li>
          <li><code>replyTo</code>：任意值 | undefined</li>
          <li><code>expiration</code>：任意值 | undefined</li>
          <li><code>messageId</code>：任意值 | undefined</li>
          <li><code>timestamp</code>：任意值 | undefined</li>
          <li><code>type</code>：任意值 | undefined</li>
          <li><code>userId</code>：任意值 | undefined</li>
          <li><code>appId</code>：任意值 | undefined</li>
          <li><code>clusterId</code>：任意值 | undefined</li>
        </ul>
      </dd>
    </dl>
  
    <h3>消息序列化</h3>
    <p>默认情况下，payload会在发布前通过`JSON.stringify()`进行序列化。要覆盖此行为，请在消息的properties.headers对象中包含
      <code>
        doNotStringifyPayload: true
      </code>
    </p>
  </script>
