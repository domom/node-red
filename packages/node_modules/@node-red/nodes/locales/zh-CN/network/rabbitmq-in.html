<script type="text/html" data-help-name="rabbitmq-in">
    <p>连接到RabbitMQ代理并接收消息。</p>
  
    <h3>输出</h3>
    <dl class="message-properties">
      <dt>fields
        <span class="property-type">object</span>
      </dt>
      <dd>
        一个 <a href="" target="_blank">rabbitmqlib</a>
        字段对象。包含：
        <ul>
          <li><code>consumerTag</code>：字符串</code></li>
          <li><code>deliveryTag</code>：数字</code></li>
          <li><code>redelivered</code>：布尔值</code></li>
          <li><code>exchange</code>：字符串</code></li>
          <li><code>routingKey</code>：字符串</code></li>
        </ul>
      </dd>
      <dt>properties
        <span class="property-type">object</span>
      </dt>
      <dd>
        标准RabbitMQ消息属性，详见 <a href="" target="_blank">amqplib文档</a>。
        <br />
        <ul>
          <li><code>contentType</code>：任意类型 | undefined</li>
          <li><code>contentEncoding</code>：任意类型 | undefined</li>
          <li><code>headers</code>：对象 | undefined</li>
          <li><code>deliveryMode</code>：任意类型 | undefined</li>
          <li><code>priority</code>：任意类型 | undefined</li>
          <li><code>correlationId</code>：任意类型 | undefined</li>
          <li><code>replyTo</code>：任意类型 | undefined</li>
          <li><code>expiration</code>：任意类型 | undefined</li>
          <li><code>messageId</code>：任意类型 | undefined</li>
          <li><code>timestamp</code>：任意类型 | undefined</li>
          <li><code>type</code>：任意类型 | undefined</li>
          <li><code>userId</code>：任意类型 | undefined</li>
          <li><code>appId</code>：任意类型 | undefined</li>
          <li><code>clusterId</code>：任意类型 | undefined</li>
        </ul>
      </dd>
      <dt>content
        <span class="property-type">buffer</span>
      </dt>
      <dt>payload
        <span class="property-type">json | object | primitive</span>
      </dt>
      <dd>接收到的消息的载荷。</dd>
    </dl>
  
    <h3>输入</h3>
    <p>
      通过发送 <code>msg.payload</code> 值为 {"reconnectCall": true} 来控制RabbitMQ代理重新连接。
    </p>
  
    <h3>详细信息</h3>
    <p>
      <code>fields</code>、<code>properties</code> 和 <code>content</code> 都来自附加到传入消息的 <a href="" target="_blank">amqplib</a> 对象。
    </p>
    <p>
      <code>msg.payload</code> 用作接收到的消息的载荷。
      如果它包含可以解析为JSON的字符串，将通过JSON.parse()进行解析。否则将按原样发送。
    </p>
  </script>
