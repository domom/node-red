
<script type="text/html" data-help-name="MySQLdatabase">
    <p>在此处添加访问数据库的凭据信息。</p>
    <p>时区可以设置为GMT、EST5EDT、UTC等格式</p>
    <p>字符集默认为"旧版"3字节MySQL UTF8编码。如果需要支持表情符号等，请使用UTF8MB4。</p>
</script>

<script type="text/html" data-help-name="mysql">
    <p>允许基本访问MySQL数据库。</p>
    <p>此节点对配置的数据库使用<b>查询</b>操作。这允许执行INSERT和DELETE操作。
    由于其特性，它允许SQL注入...所以<i>请务必谨慎使用...</i></p>
    <p><code>msg.topic</code>必须包含数据库的<i>查询语句</i>，结果将返回在<code>msg.payload</code>中。</p>
    <p><code>msg.payload</code>可以包含一个要绑定到topic的值数组。</p>
    <p>通常返回的payload将是结果行的数组。<b>注意</b>：
    这些是<i>RowDataPacket</i>类型，而不是完全标准的对象。</p>
    <p>如果没有找到对应的键，则返回<i>null</i>。</p>
    <p>重连超时时间（毫秒）可以通过在<b>settings.js</b>中添加以下行来更改
    <pre>mysqlReconnectTime: 30000,</pre></p>
</script>
